<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SFC Framework — Native components, full-stack</title>
    <meta name="description" content="A tiny full-stack framework for native web components." />
    <meta name="theme-color" content="#0a0c0b" />
    <meta name="application-name" content="SFC Framework" />
    <meta name="apple-mobile-web-app-title" content="SFC" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icons/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#0a0c0b" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <style>
      *{
        margin:0;
        padding:0;
      }
      body{
        background-color: white;
      }
      /* Keep a lightweight loading marker but avoid hiding or collapsing the page
         to prevent visual flicker when navigating between routes. */

      /* View Transition API styles for smooth page navigation */
      @view-transition {
        navigation: auto;
      }
      ::view-transition-old(root) {
        animation: fade-out 150ms ease-out;
      }
      ::view-transition-new(root) {
        animation: fade-in 150ms ease-in;
      }
      @keyframes fade-out {
        from { opacity: 1; }
        to { opacity: 0; }
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      /* Disable transitions when user prefers reduced motion or has set preference */
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-old(root),
        ::view-transition-new(root) {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
